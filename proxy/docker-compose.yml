name: proxy

services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    # host networking: proxies reach apps on localhost, and 80/443 bind directly
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../landing/site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
