name: ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      # native API and OpenAI-compatible API (http://<ip>:11434/v1)
      - "11434:11434"
    volumes:
      - models:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui:/app/backend/data

# named volumes live under /var/lib/docker on the OS drive — models are
# re-downloadable, so nothing here needs backing up
volumes:
  models:
  open-webui:
